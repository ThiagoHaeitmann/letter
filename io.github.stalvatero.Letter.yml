# Flatpak manifest for Letter (bundle / GitHub Releases; not Flathub yet).
# Build libraries for GOA / EDS / Camel into the sandbox; talk to the host
# Online Accounts and EDS daemons over D-Bus (same pattern as Geary).
# evolution-ews is bundled so Camel can open microsoft365:// stores in-process
# (host evolution-ews alone is not visible inside the sandbox).
#
# Quick test (from the repo root):
#   ./scripts/build-flatpak.sh
#   flatpak run io.github.stalvatero.Letter

app-id: io.github.stalvatero.Letter
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: letter
# Keep .mo inside the app so single-file .flatpak bundles are translated
# without a separate Locale extension.
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.gnome.ControlCenter
  - --talk-name=org.gnome.Settings
  - --talk-name=org.gnome.OnlineAccounts
  - --talk-name=org.gnome.evolution.dataserver.*
  - --talk-name=org.gnome.Calendar
  - --talk-name=org.gnome.Contacts
  - --talk-name=org.gnome.NautilusPreviewer
  - --filesystem=~/.cache/evolution:ro
  - --filesystem=xdg-download:rw
  - --filesystem=/tmp
  - --metadata=X-DConf=migrate-path=/io/github/stalvatero/Letter/

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/aclocal
  - /share/gir-1.0
  - /share/girepository-1
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/vala
  - '*.la'
  - '*.a'

modules:
  - flatpak/shared-modules/intltool/intltool-0.51.json

  - name: rest
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Dgtk_doc=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/rest/0.9/rest-0.9.1.tar.xz
        sha256: 9266a5c10ece383e193dfb7ffb07b509cc1f51521ab8dad76af96ed14212c2e3

  - name: gnome-online-accounts
    buildsystem: meson
    config-opts:
      - -Dgoabackend=false
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gnome-online-accounts/3.56/gnome-online-accounts-3.56.5.tar.xz
        sha256: 23e03dcfa03950b60e9f892f7b729ee31deeb827c655df8f78b8bca5bc197734

  - name: libical
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS:BOOL=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DGOBJECT_INTROSPECTION=true
      - -DICAL_BUILD_DOCS=false
      - -DICAL_GLIB=true
      - -DICAL_GLIB_VAPI=true
    sources:
      - type: archive
        url: https://github.com/libical/libical/releases/download/v3.0.20/libical-3.0.20.tar.gz
        sha256: e73de92f5a6ce84c1b00306446b290a2b08cdf0a80988eca0a2c9d5c3510b4c2
    cleanup:
      - /lib/cmake

  - name: evolution-data-server
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_CANBERRA=OFF
      - -DENABLE_EXAMPLES=OFF
      - -DENABLE_GOA=ON
      - -DENABLE_GOOGLE=OFF
      - -DENABLE_GTK=ON
      - -DENABLE_GTK_DOC=OFF
      - -DENABLE_INSTALLED_TESTS=OFF
      - -DENABLE_INTROSPECTION=ON
      - -DENABLE_VALA_BINDINGS=ON
      - -DENABLE_WEATHER=OFF
      - -DWITH_LIBDB=OFF
      - -DWITH_OPENLDAP=OFF
    sources:
      - type: archive
        url: https://download.gnome.org/sources/evolution-data-server/3.58/evolution-data-server-3.58.3.tar.xz
        sha256: da136d1190d9e8b09499452f6058e24eee6b77f441a8c769f74a52451bf379f1
    cleanup:
      - /lib/cmake
      # Host EDS still owns calendar/addressbook factories; keep client libs only.
      - /lib/evolution-data-server/*-backends
      - /libexec
      - /share/dbus-1/services

  # Minimal Evolution shell libs — required to build evolution-ews (Camel Graph).
  # Stripped from /bin after ews; users never launch Evolution from this Flatpak.
  - name: evolution
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_AUTOAR=OFF
      - -DENABLE_CANBERRA=OFF
      - -DENABLE_CONTACT_MAPS=OFF
      - -DENABLE_GNOME_DESKTOP=OFF
      - -DENABLE_GSPELL=OFF
      - -DENABLE_GTK_DOC=OFF
      - -DENABLE_INSTALLED_TESTS=OFF
      - -DENABLE_PST_IMPORT=OFF
      - -DENABLE_TEXT_HIGHLIGHT=OFF
      - -DENABLE_WEATHER=OFF
      - -DENABLE_YTNEF=OFF
      - -DENABLE_MARKDOWN=OFF
      - -DWITH_GLADE_CATALOG=OFF
      - -DWITH_HELP=OFF
      - -DWITH_OPENLDAP=OFF
      - -DWITH_STATIC_LDAP=OFF
      - -DWITH_BOGOFILTER=OFF
      - -DWITH_SA_LEARN=OFF
      - -DWITH_SPAMASSASSIN=OFF
    sources:
      - type: archive
        url: https://download.gnome.org/sources/evolution/3.58/evolution-3.58.3.tar.xz
        sha256: 5d01b79a5bebdf2d3a9871b61350939cf2501f6ea03c241543f744a9286d4d79

  - name: libmspack
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://deb.debian.org/debian/pool/main/libm/libmspack/libmspack_0.11.orig.tar.gz
        sha256: 70dd1fb2f0aecc36791b71a1e1840e62173079eadaa081192d1c323a0eeea21b

  - name: evolution-ews
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_MSPACK=ON
      - -DENABLE_TESTS=OFF
    sources:
      - type: archive
        url: https://download.gnome.org/sources/evolution-ews/3.58/evolution-ews-3.58.3.tar.xz
        sha256: 3f6ef8bb6389013e843e258ce1dc317a891a34f87d79780c9aef04d2741abc92
    # Drop Evolution UI leftovers now that Graph/EWS providers are installed.
    cleanup:
      - /bin
      - /share/applications
      - /share/metainfo
      - /share/dbus-1
      - /share/evolution
      - /share/GConf
      - /share/man

  - name: libcanberra
    config-opts:
      - --disable-static
      - --disable-gtk-doc
      - --disable-oss
      - --enable-pulse
      - --disable-udev
      - --disable-gtk
      - --enable-gtk3
      - --disable-lynx
    sources:
      - type: archive
        url: https://0pointer.de/lennart/projects/libcanberra/libcanberra-0.30.tar.xz
        sha256: c2b671e67e0c288a69fc33dc1b6f1b534d07882c2aceed37004bf48c601afa72
      - type: patch
        path: flatpak/libcanberra/0001-gtk-Don-t-assume-all-GdkDisplays-are-GdkX11Displays-.patch
    cleanup:
      - '*.la'
      - /include
      - /lib/pkgconfig
      - /share/gtk-doc
      - /share/man
      - /share/vala

  - name: gsound
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gsound/1.0/gsound-1.0.3.tar.xz
        sha256: ca2d039e1ebd148647017a7f548862350bc9af01986d39f10cfdc8e95f07881a

  # GNOME Platform does not ship XDG sound themes; without this GSound fails
  # with “File or data not found” for message-new-instant (and Preferences preview).
  - name: sound-theme-freedesktop
    sources:
      - type: archive
        url: https://people.freedesktop.org/~mccann/dist/sound-theme-freedesktop-0.8.tar.bz2
        sha256: cb518b20eef05ec2e82dda1fa89a292c1760dc023aba91b8aa69bafac85e8a14

  - name: letter
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Dprofile=default
    sources:
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - .git
          - _build
          - _flatpak_build
          - build
          - build-flatpak
          - build-ci
          - repo
